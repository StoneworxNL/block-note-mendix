name: Compliance

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    secrets:
        name: Secrets (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Scan the full history for secrets
              env:
                  GITLEAKS_VERSION: 8.30.1
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
                  ./gitleaks git . --no-banner --redact --verbose

    licenses:
        name: Licenses of bundled dependencies
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # BlockNote core/react/mantine are MPL-2.0 and allowed (used unmodified, notice in dependencies.txt).
            # PSF-2.0 is the Python license (argparse, via js-yaml), same as Python-2.0.
            - name: Check licenses
              run: >
                  npx --yes license-checker-rseidelsohn@4 --production --excludePrivatePackages
                  --excludePackagesStartingWith "@mendix/;@blocknote/core@;@blocknote/react@;@blocknote/mantine@;blocknote@"
                  --onlyAllow "MIT;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0;Python-2.0;PSF-2.0;CC0-1.0;BlueOak-1.0.0"
            # The @blocknote/xl-* packages are GPL-3.0 or commercial and must never be bundled.
            - name: Refuse @blocknote/xl-* packages
              run: |
                  if npm ls --omit=dev --all --parseable 2>/dev/null | grep -E "node_modules/@blocknote/xl-"; then
                      echo "::error::@blocknote/xl-* packages (GPL-3.0/commercial) are in the production dependency tree"
                      exit 1
                  fi
