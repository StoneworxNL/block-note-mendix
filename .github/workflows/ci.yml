name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # @mendix/pluggable-widgets-tools 11.12.1 and later declare engines.node
            # ^22.18.0, so CI runs on 22 to match the local build.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test
