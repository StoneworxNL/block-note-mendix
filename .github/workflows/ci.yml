name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        name: Lint, test and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            # @mendix/pluggable-widgets-tools 11.12.1 and later declare engines.node
            # ^22.18.0, so CI runs on 22 to match the local build.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test

            # Real BlockNote under jsdom: a stored javascript:/data: link must never
            # render as a clickable href.
            - run: npm run test:links

            # Production build: the .mpk includes LICENSE and dependencies.txt.
            - run: npm run release

            - name: Check license notices in the .mpk
              run: |
                  mpk=$(ls dist/*/*.mpk)
                  unzip -l "$mpk" | grep -q " LICENSE$" || { echo "LICENSE missing from $mpk"; exit 1; }
                  unzip -l "$mpk" | grep -q " dependencies.txt$" || { echo "dependencies.txt missing from $mpk"; exit 1; }

            # Mendix 11 hosts (React 19) expose no createRoot/hydrateRoot to widgets
            # (see the react-dom/client shim in rollup.config.mjs). Today the bundle
            # contains no call to either; fail if one appears.
            - name: Check the bundle does not need react-dom/client
              run: |
                  if grep -lE "createRoot|hydrateRoot" dist/tmp/widgets/stoneworx/blocknote/BlockNote.js dist/tmp/widgets/stoneworx/blocknote/BlockNote.mjs; then
                      echo "The bundle now calls createRoot/hydrateRoot, which React 19 Mendix hosts do not provide."
                      exit 1
                  fi

            - uses: actions/upload-artifact@v7
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk
