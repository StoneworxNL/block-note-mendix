name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # @mendix/pluggable-widgets-tools 11.8.1 declares engines.node >=20, and
            # the versions that would run on 22 are held back for the reasons recorded
            # against the exact pin in package.json. 20 is what the widget is built
            # with locally, so it is what CI checks against.
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test
