name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        name: Lint, test and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # @mendix/pluggable-widgets-tools 11.12.1 and later declare engines.node
            # ^22.18.0, so CI runs on 22 to match the local build.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test

            # Production build: the .mpk includes LICENSE and dependencies.txt.
            - run: npm run release

            - name: Check license notices in the .mpk
              run: |
                  mpk=$(ls dist/*/*.mpk)
                  unzip -l "$mpk" | grep -q " LICENSE$" || { echo "LICENSE missing from $mpk"; exit 1; }
                  unzip -l "$mpk" | grep -q " dependencies.txt$" || { echo "dependencies.txt missing from $mpk"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk
